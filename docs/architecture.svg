<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger app architecture</title>
  <desc id="desc">Architecture of the ShopLedger browser UI, Express server, four routers, nine library modules, config, JSON data store, and order placement flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8291a8"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3677d1"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#17243b}
      .title{font-size:34px;font-weight:750;letter-spacing:-.5px}
      .subtitle{font-size:16px;fill:#61718a}
      .section{font-size:15px;font-weight:750;letter-spacing:1.1px;fill:#53627a}
      .node{fill:#fff;stroke:#cfdae8;stroke-width:1.5}
      .ui{fill:#eef5ff;stroke:#96b9ec}
      .route{fill:#f3f0ff;stroke:#b9a9f2}
      .lib{fill:#fff;stroke:#cbd5e1}
      .state{fill:#fff8e9;stroke:#e8c16c}
      .name{font-size:16px;font-weight:700}
      .small{font-size:13px;fill:#63728a}
      .edge{fill:none;stroke:#8291a8;stroke-width:1.7;opacity:.76;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#3677d1;stroke-width:3;marker-end:url(#arrowBlue)}
      .conditional{fill:none;stroke:#d97706;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrowOrange)}
      .step{fill:#fff;stroke:#9dbce7;stroke-width:1.5}
      .stepnum{fill:#3677d1}
      .stepnumtext{font-size:14px;font-weight:800;fill:#fff;text-anchor:middle}
      .steptext{font-size:14px;font-weight:650}
      .stepdetail{font-size:12px;fill:#64748b}
      .pill{font-size:11px;font-weight:750;fill:#fff}
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#f5f7fb"/>
  <text x="48" y="58" class="title">ShopLedger · app architecture</text>
  <text x="48" y="88" class="subtitle">Browser POS → Express routes → business modules → JSON file</text>

  <!-- Main architecture panels -->
  <rect x="32" y="116" width="265" height="635" rx="18" fill="#eaf2ff" stroke="#c6d9f6"/>
  <rect x="320" y="116" width="245" height="635" rx="18" fill="#f0edff" stroke="#d6cdfa"/>
  <rect x="588" y="116" width="700" height="635" rx="18" fill="#eef2f7" stroke="#d5dde8"/>
  <rect x="1310" y="116" width="258" height="635" rx="18" fill="#fff5df" stroke="#f1d99c"/>
  <text x="54" y="149" class="section">BROWSER UI</text>
  <text x="342" y="149" class="section">EXPRESS APP</text>
  <text x="610" y="149" class="section">ROUTES + LIB MODULES</text>
  <text x="1332" y="149" class="section">CONFIG + DATA</text>

  <!-- UI nodes -->
  <rect x="54" y="174" width="221" height="125" rx="12" class="node ui"/>
  <text x="72" y="204" class="name">public/index.html</text>
  <text x="72" y="231" class="small">New Order · Order History</text>
  <text x="72" y="252" class="small">Khata · Inventory &amp; GST Audit</text>
  <text x="72" y="279" class="small">Served as static content</text>
  <rect x="54" y="322" width="221" height="125" rx="12" class="node ui"/>
  <text x="72" y="352" class="name">public/js/app.js</text>
  <text x="72" y="379" class="small">Loads data, renders views</text>
  <text x="72" y="400" class="small">Previews cart, sends API requests</text>
  <text x="72" y="427" class="small">Refreshes after order creation</text>
  <rect x="54" y="470" width="221" height="90" rx="12" class="node ui"/>
  <text x="72" y="502" class="name">public/css/style.css</text>
  <text x="72" y="529" class="small">POS layout and styling</text>
  <rect x="54" y="584" width="221" height="90" rx="12" class="node ui"/>
  <text x="72" y="616" class="name">Browser requests</text>
  <text x="72" y="643" class="small">GET /api · POST /api</text>

  <!-- Server -->
  <rect x="342" y="174" width="201" height="172" rx="12" class="node route"/>
  <text x="361" y="207" class="name">server.js</text>
  <text x="361" y="235" class="small">Express app</text>
  <text x="361" y="258" class="small">body-parser JSON</text>
  <text x="361" y="281" class="small">serves public/</text>
  <text x="361" y="304" class="small">mounts 4 routers at /api</text>
  <rect x="342" y="376" width="201" height="135" rx="12" class="node route"/>
  <text x="361" y="409" class="name">Invoice page route</text>
  <text x="361" y="437" class="small">GET /orders/:id/invoice</text>
  <text x="361" y="460" class="small">store → orders.get</text>
  <text x="361" y="483" class="small">invoice.render → HTML</text>
  <rect x="342" y="541" width="201" height="90" rx="12" class="node route"/>
  <text x="361" y="574" class="name">config.port</text>
  <text x="361" y="601" class="small">PORT or 3000</text>

  <!-- Routers -->
  <text x="610" y="183" class="section">routes/</text>
  <rect x="610" y="198" width="205" height="82" rx="11" class="node route"/>
  <text x="628" y="230" class="name">products.js</text>
  <text x="628" y="255" class="small">GET products, coupons</text>
  <rect x="831" y="198" width="205" height="82" rx="11" class="node route"/>
  <text x="849" y="230" class="name">orders.js</text>
  <text x="849" y="255" class="small">list · create · cancel</text>
  <rect x="1052" y="198" width="205" height="82" rx="11" class="node route"/>
  <text x="1070" y="230" class="name">customers.js</text>
  <text x="1070" y="255" class="small">customers · settlements</text>
  <rect x="610" y="294" width="205" height="82" rx="11" class="node route"/>
  <text x="628" y="326" class="name">reports.js</text>
  <text x="628" y="351" class="small">dashboard · preview · export</text>
  <rect x="831" y="294" width="426" height="82" rx="11" class="node route"/>
  <text x="849" y="326" class="name">Order placement path</text>
  <text x="849" y="351" class="small">POST /api/orders · validates and coordinates modules</text>

  <!-- Library modules -->
  <text x="610" y="413" class="section">lib/</text>
  <rect x="610" y="428" width="205" height="77" rx="11" class="node lib"/>
  <text x="628" y="459" class="name">orders.js</text>
  <text x="628" y="483" class="small">create · get · list · cancel</text>
  <rect x="831" y="428" width="205" height="77" rx="11" class="node lib"/>
  <text x="849" y="459" class="name">inventory.js</text>
  <text x="849" y="483" class="small">find · check · reserve · release</text>
  <rect x="1052" y="428" width="205" height="77" rx="11" class="node lib"/>
  <text x="1070" y="459" class="name">pricing.js</text>
  <text x="1070" y="483" class="small">subtotal · discount · GST · total</text>
  <rect x="610" y="519" width="205" height="77" rx="11" class="node lib"/>
  <text x="628" y="550" class="name">coupons.js</text>
  <text x="628" y="574" class="small">normalize · validate · discount</text>
  <rect x="831" y="519" width="205" height="77" rx="11" class="node lib"/>
  <text x="849" y="550" class="name">tax.js</text>
  <text x="849" y="574" class="small">HSN rates · CGST/SGST split</text>
  <rect x="1052" y="519" width="205" height="77" rx="11" class="node lib"/>
  <text x="1070" y="550" class="name">ledger.js</text>
  <text x="1070" y="574" class="small">Khata · limits · settlements</text>
  <rect x="610" y="610" width="205" height="77" rx="11" class="node lib"/>
  <text x="628" y="641" class="name">reports.js</text>
  <text x="628" y="665" class="small">dashboard · GST reconciliation</text>
  <rect x="831" y="610" width="205" height="77" rx="11" class="node lib"/>
  <text x="849" y="641" class="name">invoice.js</text>
  <text x="849" y="665" class="small">invoice figures · printable HTML</text>
  <rect x="1052" y="610" width="205" height="77" rx="11" class="node lib"/>
  <text x="1070" y="641" class="name">dates.js</text>
  <text x="1070" y="665" class="small">today · date keys · fiscal year</text>
  <rect x="831" y="700" width="205" height="38" rx="10" class="node lib"/>
  <text x="849" y="725" class="name">store.js · read/write/audit</text>

  <!-- State -->
  <rect x="1332" y="184" width="214" height="112" rx="12" class="node state"/>
  <text x="1350" y="218" class="name">config.js</text>
  <text x="1350" y="245" class="small">shop · tax · coupons</text>
  <text x="1350" y="268" class="small">inventory defaults · port</text>
  <rect x="1332" y="330" width="214" height="150" rx="12" class="node state"/>
  <text x="1350" y="365" class="name">data/db.json</text>
  <text x="1350" y="394" class="small">products · orders</text>
  <text x="1350" y="417" class="small">customers · settlements</text>
  <text x="1350" y="440" class="small">auditLog · ID counters</text>
  <text x="1350" y="464" class="small">read/write via lib/store.js</text>
  <rect x="1332" y="518" width="214" height="116" rx="12" class="node state"/>
  <text x="1350" y="552" class="name">lib/store.js</text>
  <text x="1350" y="579" class="small">fs + path</text>
  <text x="1350" y="602" class="small">reads/writes whole JSON file</text>

  <!-- Structural connectors -->
  <path d="M275 383 H310 V250 H342" class="edge"/>
  <path d="M442 346 V376" class="edge"/>
  <path d="M543 260 H576 V239 H610" class="edge"/>
  <path d="M576 239 H831" class="edge"/>
  <path d="M576 239 H1052" class="edge"/>
  <path d="M576 239 V335 H610" class="edge"/>
  <path d="M1036 739 H1298 V576 H1332" class="edge"/>

  <!-- Order flow section -->
  <rect x="32" y="785" width="1536" height="286" rx="18" fill="#edf5ff" stroke="#c5d9f5"/>
  <text x="56" y="824" class="section" fill="#285c9f">PLACE AN ORDER · REQUEST AND EFFECTS</text>
  <path d="M330 918 H354" class="flow"/>
  <path d="M630 918 H654" class="flow"/>
  <path d="M930 918 H954" class="flow"/>
  <path d="M1230 918 H1254" class="flow"/>
  <rect x="56" y="850" width="274" height="140" rx="13" class="step"/>
  <circle cx="80" cy="876" r="14" class="stepnum"/><text x="80" y="881" class="stepnumtext">1</text>
  <text x="104" y="881" class="steptext">UI sends cart</text>
  <text x="76" y="916" class="stepdetail">POST /api/orders</text>
  <text x="76" y="940" class="stepdetail">items · customer · mode</text>
  <text x="76" y="964" class="stepdetail">status · coupon</text>
  <rect x="354" y="850" width="276" height="140" rx="13" class="step"/>
  <circle cx="378" cy="876" r="14" class="stepnum"/><text x="378" y="881" class="stepnumtext">2</text>
  <text x="402" y="881" class="steptext">Validate and price</text>
  <text x="374" y="916" class="stepdetail">routes/orders.js</text>
  <text x="374" y="940" class="stepdetail">inventory.check · pricing.js</text>
  <text x="374" y="964" class="stepdetail">coupons.js · tax.js</text>
  <rect x="654" y="850" width="276" height="140" rx="13" class="step"/>
  <circle cx="678" cy="876" r="14" class="stepnum"/><text x="678" y="881" class="stepnumtext">3</text>
  <text x="702" y="881" class="steptext">Apply account effects</text>
  <text x="674" y="916" class="stepdetail">Khata selected: ledger.js checks limit</text>
  <text x="674" y="940" class="stepdetail">inventory.reserve deducts stock</text>
  <text x="674" y="964" class="stepdetail">orders.add creates order record</text>
  <rect x="954" y="850" width="276" height="140" rx="13" class="step"/>
  <circle cx="978" cy="876" r="14" class="stepnum"/><text x="978" y="881" class="stepnumtext">4</text>
  <text x="1002" y="881" class="steptext">Save and audit</text>
  <text x="974" y="916" class="stepdetail">store.appendAudit</text>
  <text x="974" y="940" class="stepdetail">store.write → data/db.json</text>
  <text x="974" y="964" class="stepdetail">returns order with HTTP 201</text>
  <rect x="1254" y="850" width="286" height="140" rx="13" class="step"/>
  <circle cx="1278" cy="876" r="14" class="stepnum"/><text x="1278" y="881" class="stepnumtext">5</text>
  <text x="1302" y="881" class="steptext">UI refreshes</text>
  <text x="1274" y="916" class="stepdetail">clears cart · reloads products</text>
  <text x="1274" y="940" class="stepdetail">refreshes dashboard/customers</text>
  <text x="1274" y="964" class="stepdetail">offers invoice page link</text>
  <path d="M780 1005 H820" class="conditional"/>
  <text x="834" y="1010" class="small">dashed orange = conditional Khata debit</text>
  <path d="M1080 1005 H1120" class="flow"/>
  <text x="1134" y="1010" class="small">blue = order request/response sequence</text>
  <text x="56" y="1048" class="small">Static UI: public/index.html · public/js/app.js · public/css/style.css</text>
</svg>
